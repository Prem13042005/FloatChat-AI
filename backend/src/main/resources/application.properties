spring.application.name=floatchat-backend

# SERVER
server.port=8080

# POSTGRESQL APPLICATION DATABASE
spring.datasource.url=jdbc:postgresql://${APP_DB_HOST:127.0.0.1}:${APP_DB_PORT:5433}/${APP_DB_NAME:floatchat_app}
spring.datasource.username=${APP_DB_USER:floatchat_app_user}
spring.datasource.password=${APP_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# FRONTEND CORS
app.frontend-url=http://localhost:5173

# JWT (Requires explicit JWT_SECRET environment variable in production)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# AI SERVICE CONFIGURATION
app.ai.mode=${APP_AI_MODE:mock}
ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8000}
ai.service.internal-secret=${FLOATCHAT_INTERNAL_SECRET:}
ai.service.connect-timeout-ms=${AI_SERVICE_CONNECT_TIMEOUT_MS:3000}
ai.service.read-timeout-ms=${AI_SERVICE_READ_TIMEOUT_MS:150000}

# FILE UPLOAD
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# RATE LIMITING (In-Memory, Single-Instance)
app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}
app.rate-limit.login.limit=${APP_RATE_LIMIT_LOGIN_LIMIT:5}
app.rate-limit.login.window-seconds=${APP_RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
app.rate-limit.signup.limit=${APP_RATE_LIMIT_SIGNUP_LIMIT:3}
app.rate-limit.signup.window-seconds=${APP_RATE_LIMIT_SIGNUP_WINDOW_SECONDS:60}
app.rate-limit.bootstrap.limit=${APP_RATE_LIMIT_BOOTSTRAP_LIMIT:3}
app.rate-limit.bootstrap.window-seconds=${APP_RATE_LIMIT_BOOTSTRAP_WINDOW_SECONDS:60}
app.rate-limit.chat.limit=${APP_RATE_LIMIT_CHAT_LIMIT:10}
app.rate-limit.chat.window-seconds=${APP_RATE_LIMIT_CHAT_WINDOW_SECONDS:60}
app.rate-limit.max-entries=${APP_RATE_LIMIT_MAX_ENTRIES:10000}

